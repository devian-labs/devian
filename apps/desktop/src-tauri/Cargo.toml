[package]
name = "devian-desktop"
version = "1.2.1"
description = "See and control what AI coding agents do on your machine"
authors = ["Devian Labs"]
license = "MIT"
repository = "https://github.com/devian-labs/devian"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
walkdir = "2"
sha2 = "0.11.0"
reqwest = { version = "0.13", features = ["stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
regex = "1"
base64 = "0.22.1"
chrono = "0.4"
# Pinned below latest (0.40 pulls libsqlite3-sys 0.38, whose bundled build.rs
# uses the unstable `cfg_select!` macro and fails to compile on stable rustc).
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "component", "disk"] }
trash = "5"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
