name: Test build

# Installers for testers, attached to the workflow run as downloadable
# artifacts. Unlike Release, this publishes nothing: no GitHub release, no
# Homebrew bump, no updater manifest, so existing users aren't offered it.
#
# Run it from the Actions tab ("Run workflow"), or push a branch named
# test-build/<anything>.

on:
  workflow_dispatch:
  push:
    branches: ["test-build/**"]

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            platform: windows-latest
            args: "--bundles nsis,msi"
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
            artifact: devian-windows-x64
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
            artifact: devian-linux-x64
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            bundle_dir: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact: devian-macos-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      # Same checks as CI, so a broken build fails before packaging.
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: mkdir -p ../dist && cargo test --lib

      - name: Build installers
        run: npm run tauri:build -w @devian/desktop -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/appimage/*.AppImage
            ${{ matrix.bundle_dir }}/dmg/*.dmg
