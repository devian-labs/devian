version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react (via eslint-config-next) doesn't support ESLint 10 yet.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Tauri 3 is still in alpha.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major"]
      # Types follow the Node LTS in .nvmrc, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
